version: "3.8"
services:
  # --- Vulnerable LMS target (primary) ---
  db:
    image: mysql:8.0
    container_name: lms-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lms
    volumes:
      - ./targets/lms/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - lms-db-data:/var/lib/mysql

  lms:
    build:
      context: ./targets/lms
      dockerfile: Dockerfile
    container_name: lms
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: lms
    ports:
      - "5000:5000"   # direct access (no WAF) for baseline tests; local only
    depends_on:
      - db

  nginx-modsec:
    build:
      context: .
      dockerfile: docker/nginx-modsec/Dockerfile
    container_name: nginx-modsec
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./modsec-config/modsecurity.conf:/etc/modsecurity/modsecurity.conf:ro
      - ./modsec-config/nginx.conf:/usr/local/nginx/conf/nginx.conf:ro
      - ./modsec-config/entrypoint.sh:/entrypoint.sh:ro
      - ./modsec-logs:/var/log/modsecurity
      - ./rules/crs:/etc/modsecurity/crs:ro
      - ./rules/custom:/etc/modsecurity/custom-rules
    depends_on:
      - lms

volumes:
  lms-db-data:
